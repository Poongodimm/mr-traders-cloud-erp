<body class="min-h-screen flex flex-col">

  <div id="loginScreen" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">

      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-xl bg-indigo-600 text-white mx-auto flex items-center justify-center text-xl shadow-lg shadow-indigo-200">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight">RSP POS Authentication</h2>
        <p class="text-xs text-gray-500">Reverie Synaptic Pulse Node V3.0 — MR Traders</p>
      </div>

      <div class="space-y-4">

          <label class="block text-xs font-semibold text-gray-700 mb-1">Select User Account</label>

            <option value="admin">Super Admin — mrtraders3355@gmail.com</option>
            <option value="worker">Worker — arundon1002@gmail.com</option>
            <option value="auditor">Auditor — auditor@mrtraders.com</option>
          </select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-gray-700">Security PIN / Password</label>
            <button type="button" onclick="openForgotModal()" class="text-[11px] text-indigo-600 hover:underline font-medium">Forgot Pin?</button>
          </div>
          <input type="password" id="loginPin" placeholder="Enter PIN (Default: 1234)" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 focus:outline-none">
        </div>

        <button type="button" onclick="performLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-md transition">
          <i class="fa-solid fa-right-to-bracket mr-2"></i>Sign In & Access Terminal
        </button>
      </div>
      <p class="text-[11px] text-gray-400 text-center font-mono">Demo PIN for all accounts: <span class="text-indigo-600 font-bold">1234</span></p>
    </div>
  </div>

  <!-- FORGOT PIN MODAL -->
  <div id="forgotModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-sm w-full p-6 rounded-2xl border border-gray-100 space-y-4 shadow-xl">

      <p class="text-xs text-gray-500">Enter your registered email address (e.g. mrtraders3355@gmail.com) to receive an OTP code.</p>
